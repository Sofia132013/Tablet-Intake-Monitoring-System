<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Pill Reminder — Sign In</title>
  <!-- Font Awesome & Google Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="login.css">
</head>
<body>
<div class="auth-card">
  <div class="auth-header">
    <i class="fas fa-capsules"></i>
    <h1>Pill Reminder</h1>
    <p>Track your medication schedule</p>
  </div>
  <div class="form-container">
    <!-- Login field -->
    <div class="input-wrapper" id="loginWrapper">
      <div class="input-field">
        <i class="fas fa-user"></i>
        <input type="text" id="loginUsername" placeholder="Username or email" autocomplete="username">
      </div>
      <div class="error-message" id="loginError">⚠️ Please enter your login</div>
    </div>

    <!-- Password field -->
    <div class="input-wrapper" id="passwordWrapper">
      <div class="input-field">
        <i class="fas fa-lock"></i>
        <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password">
      </div>
      <div class="error-message" id="passwordError">⚠️ Please enter your password</div>
    </div>

    <button class="signin-btn" id="doSigninBtn">
      <i class="fas fa-arrow-right-to-bracket"></i> Sign In
    </button>

  </div>
</div>
<script src="login.js" type="module"></script>
</body>
</html>
